[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "radar-valorizacion-urbana"
version = "0.1.0"
description = "Sistema de predicción de valorización inmobiliaria para Quito y Guayaquil, Ecuador"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Radar de Valorización Urbana Team"},
]
keywords = ["real-estate", "valuation", "geospatial", "machine-learning", "ecuador"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
models = [
    "lightgbm>=4.0",
    "shap>=0.43",
    # "torch>=2.0",
]
geo = [
    "h3>=4.0",
    # "geopandas>=0.14",
]
viz = [
    "matplotlib>=3.7",
    "plotly>=5.15",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.26",
]

[project.urls]
Repository = "https://github.com/radar-valorizacion-urbana/radar-valorizacion-urbana"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E501"]
